<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <link rel="stylesheet" type="text/css" href="../static/styles.css">
</head>
<body class="container1">
    <div class="cardr">
        <h1 class="color1">Predicted Crops:</h1>
        <div class="crop-container">
            {% for crop in top_n_crops %}
                <div class="crop-item">
                    <h3>{{ crop }}</h3>
                    <img src="/static/crop_images/{{ crop }}.jpg" 
                         alt="{{ crop }} image">
                </div>
            {% endfor %}
        </div>
        <div class="form-groupr">
            <form action="/index" method="get">
                <button id="start-button">Back</button>
            </form><br>
            <form action="/" method="get">
                <button id="start-button">Home</button>
            </form>
        </div>
    </div>
</body>
</html>
